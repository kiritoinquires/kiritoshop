<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirito Shop — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #2a2a3a;
      --accent: #7c5cfc;
      --accent2: #c084fc;
      --text: #f0f0ff;
      --muted: #7070a0;
      --success: #22d3a5;
      --error: #f43f5e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(124, 92, 252, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 92, 252, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-glow {
      position: fixed;
      z-index: 0;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 92, 252, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .register-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      margin: 24px 16px;
      box-shadow: 0 0 60px rgba(124, 92, 252, 0.08), 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .step-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: var(--accent);
      width: 20px;
      border-radius: 3px;
    }

    .step-dot.done {
      background: var(--success);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: var(--muted);
    }

    input.valid {
      border-color: var(--success);
    }

    input.invalid {
      border-color: var(--error);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 92, 252, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 0;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: var(--accent);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert.error {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--error);
    }

    .alert.success {
      background: rgba(34, 211, 165, 0.1);
      border: 1px solid rgba(34, 211, 165, 0.3);
      color: var(--success);
    }

    .alert.show {
      display: block;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 48px;
    }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 14px;
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
    }

    .pw-strength {
      margin-top: -10px;
      margin-bottom: 16px;
    }

    .pw-strength-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 4px;
    }

    .pw-strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }

    .pw-strength-label {
      font-size: 11px;
      color: var(--muted);
    }

    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: -10px;
      margin-bottom: 14px;
    }

    .field-hint.ok {
      color: var(--success);
    }

    .field-hint.bad {
      color: var(--error);
    }

    .code-inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .code-inputs input {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      padding: 16px 8px;
      margin: 0;
      flex: 1;
      min-width: 0;
    }

    .timer {
      font-size: 13px;
      color: var(--accent);
      text-align: center;
      margin-top: 8px;
    }

    .resend-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
    }

    .resend-link a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .resend-link a:hover {
      text-decoration: underline;
    }

    .login-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
    }

    .login-link a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: rgba(34, 211, 165, 0.1);
      border: 2px solid var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="/assets/glass-theme.css">
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="register-card">
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <span class="logo-text">Kirito Shop</span>
    </div>

    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>

    <div class="step active" id="step1">
      <h1>Create Account</h1>
      <p class="subtitle">Join Kirito Shop to get started</p>

      <label>Username</label>
      <input type="text" id="regUsername" placeholder="e.g. pornstar" maxlength="20" oninput="checkUsername(this)" onkeydown="if(event.key==='Enter') document.getElementById('regEmail').focus()">
      <div class="field-hint" id="usernameHint">3–20 characters, letters and numbers only</div>

      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="you@example.com" onkeydown="if(event.key==='Enter') document.getElementById('regPassword').focus()">

      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="regPassword" placeholder="Minimum 8 characters" minlength="8" oninput="checkPwStrength(this.value)" onkeydown="if(event.key==='Enter') document.getElementById('regConfirmPw').focus()">
        <button class="toggle-pw" onclick="togglePw('regPassword')">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
      <div class="pw-strength" id="pwStrengthWrap" style="display:none;">
        <div class="pw-strength-bar">
          <div class="pw-strength-fill" id="pwStrengthFill"></div>
        </div>
        <div class="pw-strength-label" id="pwStrengthLabel"></div>
      </div>

      <label>Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="regConfirmPw" placeholder="Repeat your password" onkeydown="if(event.key==='Enter') proceedToVerify()">
        <button class="toggle-pw" onclick="togglePw('regConfirmPw')">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <div class="alert error" id="step1Alert"></div>
      <button class="btn-primary" id="proceedBtn" onclick="proceedToVerify()">Continue</button>

      <div class="login-link">Already have an account? <a href="../index.php">Sign in</a></div>
    </div>

    <div class="step" id="step2">
      <div class="success-icon">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 style="text-align:center;">Account Created!</h1>
      <p class="subtitle" style="text-align:center;">Welcome to Kirito Shop<span id="welcomeName" style="color:var(--accent);font-weight:600;"></span>!</p>
      <div style="height:24px;"></div>
      <button class="btn-primary" onclick="window.location.href='home.php'">Go to Store →</button>
    </div>

  </div>

  <script>
  window.__Kirito_DATA__ = window.__Kirito_DATA__ || {};
  window.__Kirito_DATA__.appConfig = {};</script>
<script src="/assets/js/register.js" type="module"></script>
  <script src="/assets/js/site-enhance.js" defer></script>
</body>

</html>
